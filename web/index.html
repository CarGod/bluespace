function detectLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === 'zh' || saved === 'en') return saved;
  } catch { /* private mode, or storage disabled */ }
  const nav = (navigator.language || '') + ' ' + (navigator.languages || []).join(' ');
  return /\bzh\b|zh-/i.test(nav) ? 'zh' : 'en';
}

/**
 * Translate, then fill {0}, {1}… — the arguments are DATA and go in verbatim.
 *
 * Named `tr` rather than `t` because `t` is already the TASK in half the render
 * functions, and that collision would have been silent: `t('tokens')` on a task
 * object only throws when that branch is reached.
 */
function tr(str, ...args) {
  let out = (app.lang === 'zh' && ZH[str]) || str;
  for (let i = 0; i < args.length; i++) out = out.split('{' + i + '}').join(String(args[i]));
  return out;
}

/** Counted nouns, where English needs an -s and Chinese needs a measure word. */
function nOf(n, one, many, zh) {
  return app.lang === 'zh' ? n + ' ' + zh : n + ' ' + (n === 1 ? one : many);
}

function setLang(lang) {
  app.lang = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch { /* nothing to do about it */ }
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  // The connection label is set imperatively and only on change, so it has to be
  // pushed again by hand or it stays in the language it was last painted in.
  const mode = app.conn;
  app.conn = null;
  setConn(mode);
  paint();
}

const MAX_EVENTS = 40000;
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const attr = (s) => esc(s).replace(/\n/g, '&#10;');
const sc = (state) => `--sc: var(${STATE_VAR[state] || '--s-queued'})`;
/** The eight characters `blue ps` prints and every `blue <cmd> <id>` accepts. */
const shortId = (id) => String(id == null ? '' : id).slice(0, 8);
/** A state's name in the reader's language; the raw state if it has none. */
const stateLabel = (state) => tr(STATE_LABEL[state] || state);

/* ---- formatting ---------------------------------------------------------- */
function tokens(n) {
  const v = Number(n) || 0;
  if (v <= 0) return '0';
  if (v < 1000) return String(Math.round(v));
  if (v < 1e6) return trimNum(v / 1e3) + 'k';
  if (v < 1e9) return trimNum(v / 1e6) + 'M';
  return trimNum(v / 1e9) + 'B';
}
function trimNum(v) {
  const t = v < 100 ? v.toFixed(1) : v.toFixed(0);
  return t.endsWith('.0') ? t.slice(0, -2) : t;
}
/** Tokens for a task, from the usage projection keyed by task id. */
function taskTokens(id) {
  const u = app.usage.byTask && app.usage.byTask[id];
  if (!u || !u.totals) return 0;
  const c = u.totals;
  return (c.input || 0) + (c.output || 0) + (c.cacheRead || 0) + (c.cacheCreation || 0);
}
/** How the fleet's dollars may be described — spend, or an equivalence. */
function usdLabel() {
  return app.usage.metered
    ? money(app.cost.totalUsd) + ' spent'
    : '≈' + money(app.cost.totalUsd) + ' at API list price — not spend; these tokens came out of your Claude subscription quota';
}
function money(n) {
  const v = Number(n) || 0;
  if (v === 0) return '$0.00';
  if (v < 0.01) return '<$0.01';
  if (v < 100) return '$' + v.toFixed(2);
  return '$' + Math.round(v).toLocaleString();
}
function dur(ms) {
  if (!Number.isFinite(ms) || ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ' + (s % 60) + 's';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}
function durShort(ms) {
  if (!Number.isFinite(ms) || ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 48) return h + 'h';
  return Math.floor(h / 24) + 'd';
}
function clock(t) {
  const d = new Date(t);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function truncate(s, n) {
  s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

/* ---- derived lookups ------------------------------------------------------ */
const taskById = () => new Map(app.tasks.map((t) => [t.id, t]));
function projectName(id) {
  const p = app.projects.find((x) => x.id === id);
  return p ? p.name : (id ? String(id).slice(0, 8) : 'unknown project');
}
function activeCrewCount() { return app.tasks.filter((t) => ACTIVE.has(t.state)).length; }

/**
 * What the board draws — everything, minus what the captain has cleared away.
 *
 * Deliberately NOT used by anything that counts: tokens, active crew and the
 * header stats read `app.tasks`. Dismissing is about the eye, never about the
 * record, and the moment a total starts moving when a card is hidden the two
 * have been confused.
 */
function boardTasks() {
  return app.showDismissed ? app.tasks : app.tasks.filter((t) => !t.dismissedAt);
}
function dismissedCount() { return app.tasks.filter((t) => t.dismissedAt).length; }

/** Newest crew signal per task — what the Crew is doing right now, in one line. */
function lastActivity() {
  const crewToTask = new Map();
  const out = new Map();
  for (const e of app.events) {
    if (e.type === 'crew.spawned' || e.type === 'task.dispatched') crewToTask.set(e.crewId, e.taskId);
    let taskId = e.taskId;
    if (!taskId && e.crewId) taskId = crewToTask.get(e.crewId);
    if (!taskId) continue;
    let line = null;
    if (e.type === 'crew.tool_use') line = e.name + (e.inputPreview ? ' · ' + truncate(e.inputPreview, 70) : '');
    else if (e.type === 'crew.text') line = truncate(e.text, 90);
    else if (e.type === 'crew.thinking') line = tr('thinking…');
    else if (e.type === 'sentinel.started') line = tr('sentinel reviewing the diff');
    else if (e.type === 'sentinel.verdict') line = (e.pass ? tr('verdict: pass — ') : tr('verdict: fail — ')) + truncate(e.reasoning, 70);
    else if (e.type === 'crew.exited') line = tr('crew exited') + (e.reason ? ' · ' + truncate(e.reason, 50) : '');
    // The only event here that records a write to a real repository. Named with
    // its target, because which branch it went to is the whole point of it.
    else if (e.type === 'task.merged') line = e.alreadyMerged ? tr('already in {0}', e.into) : tr('merged into {0}', e.into);
    if (line) out.set(taskId, { line, at: e.at });
  }
  return out;
}

/* ---- transport ------------------------------------------------------------ */
async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}));
  let body = null;
  try { body = await res.json(); } catch { /* non-JSON body */ }
  if (!res.ok) throw new Error((body && body.error) || ('request failed (' + res.status + ')'));
  return body;
}

async function loadState() {
  const s = await api('/api/state');
  app.tasks = s.tasks || [];
  app.held = new Set(s.held || []);
  app.decisions = s.decisions || [];
  app.allDecisions = s.allDecisions || app.decisions;
  app.projects = s.projects || [];
  app.cost = s.cost || app.cost;
  app.usage = s.usage || app.usage;
  app.now = s.now || Date.now();
  app.loaded = true;
  paint();
}

/**
 * Helm's own fan-out — the one spender this map used to be blind to.
 *
 * Observed: the captain asked for a template upgrade, Helm launched two
 * sub-agents that burned 153.4k and 128.5k tokens in two minutes, and this page
 * said "Nothing needs you · 0 crew working" the whole time. Their question was
 * *"map 里面为啥看不到当前执行的任务"*.
 *
 * On a SLOW timer and never on the stream: this costs the server a directory
 * search and a pass over each transcript, and the numbers are after-the-fact
 * whatever the interval — a fast poll would only make a snapshot look live.
 * Failure is silent by design; a dashboard that cannot read someone else's
 * files still has a fleet to draw.
 */
async function loadHelm() {
  try {
    const r = await api('/api/helm');
    app.helm = { windows: r.windows || [], observedAt: r.now || Date.now() };
    paint();
  } catch { /* the fleet view is unaffected */ }
}

/**
 * Pulls every event we do not have yet. `app.seq` is the high-water mark of
 * what we HOLD, never what the server has — advancing it from /api/state would
 * skip the backlog on first load and leave the timeline empty.
 */
async function loadEvents() {
  const r = await api('/api/events?since=' + app.seq);
  ingest(r.events || []);
}

function ingest(list) {
  let added = false;
  for (const e of list) {
    if (!e || typeof e.seq !== 'number') continue;
    if (e.seq <= app.seq) continue;
    app.events.push(e);
    app.seq = e.seq;
    added = true;
  }
  if (app.events.length > MAX_EVENTS) app.events.splice(0, app.events.length - MAX_EVENTS);
  return added;
}

let source = null, pollTimer = null, refreshTimer = null, reviveTimer = null;

function setConn(mode) {
  if (app.conn === mode) return;
  app.conn = mode;
  const node = el('conn');
  node.dataset.mode = mode;
  el('conn-label').textContent = mode === 'live' ? tr('live') : mode === 'poll' ? tr('polling') : tr('offline');
  node.title = mode === 'live' ? tr('Streaming events live')
    : mode === 'poll' ? tr('Event stream unavailable — polling every 3s')
    : tr('Not connected to the Starmap server');
}

function connect() {
  if (!window.EventSource) { startPolling(); return; }
  try { source = new EventSource('/api/stream?since=' + app.seq); }
  catch { startPolling(); return; }

  source.onopen = () => { stopPolling(); setConn('live'); };
  source.onmessage = (ev) => {
    let e = null;
    try { e = JSON.parse(ev.data); } catch { return; }
    if (ingest([e])) { scheduleRefresh(); paint(); }
  };
  source.addEventListener('hello', () => { stopPolling(); setConn('live'); });
  source.onerror = () => {
    // EventSource retries on its own; polling covers the gap either way.
    if (source && source.readyState === EventSource.CLOSED) {
      source = null;
      clearTimeout(reviveTimer);
      reviveTimer = setTimeout(connect, 8000);
    }
    startPolling();
  };
}

function startPolling() {
  setConn(app.loaded ? 'poll' : 'down');
  if (pollTimer) return;
  pollTimer = setInterval(() => {
    loadState().then(loadEvents).then(() => { if (!source || source.readyState !== 1) setConn('poll'); })
      .catch(() => setConn('down'));
  }, 3000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

/** Projections live on the server; a new event just means "ask again, soon". */
function scheduleRefresh() {
  if (refreshTimer) return;
  refreshTimer = setTimeout(() => {
    refreshTimer = null;
    loadState().catch(() => setConn('down'));
  }, 260);
}

/* ---- render scheduling ---------------------------------------------------- */
let painting = false, pendingPaint = false, retimer = null;
function typing() {
  const a = document.activeElement;
  return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
}
function paint() {
  if (painting) { pendingPaint = true; return; }
  if (typing()) { clearTimeout(retimer); retimer = setTimeout(paint, 900); return; }
  painting = true;
  requestAnimationFrame(() => {
    try { render(); } finally {
      painting = false;
      if (pendingPaint) { pendingPaint = false; paint(); }
    }
  });
}

/* ---- header + chrome ------------------------------------------------------ */
/** The parts of the page that are markup rather than a render function. */
function renderChrome() {
  const set = (sel, text) => { const n = document.querySelector(sel); if (n) n.textContent = text; };
  set('.brand .sub', tr('BlueSpace fleet control'));
  set('#k-spend', tr('Tokens'));
  set('#stat-crew .k', tr('Active crew'));
  set('#stat-dec .k', tr('Needs you'));
  const conn = el('conn');
  if (conn) conn.title = tr('Live connection status');
  const lang = el('lang');
  if (lang) {
    // The button shows the language it switches TO, which is the only reading
    // that is unambiguous at a glance in either language.
    lang.textContent = app.lang === 'zh' ? 'EN' : '中';
    lang.title = tr('Switch to Chinese');
  }
  const labels = { inbox: tr('Inbox'), fleet: tr('Fleet'), diff: tr('Diff'), timeline: tr('Timeline'), config: tr('Settings') };
  for (const tab of document.querySelectorAll('.tab')) {
    const badge = tab.querySelector('.badge, .num');
    tab.textContent = labels[tab.dataset.view] || tab.dataset.view;
    if (badge) { tab.append(' '); tab.appendChild(badge); }
  }
}

function renderHeader() {
  renderChrome();
  el('v-spend').textContent = tokens(app.usage.total);
  el('stat-spend').title = usdLabel();
  const crew = activeCrewCount();
  el('v-crew').textContent = String(crew);
  el('stat-crew').classList.toggle('live', crew > 0);
  const open = app.decisions.length;
  el('v-dec').textContent = String(open);
  el('stat-dec').classList.toggle('alert', open > 0);
  const badge = el('tab-dec');
  badge.textContent = String(open);
  badge.classList.toggle('hot', open > 0);
  // The badge counts what the board draws. A cleared task is still in every
  // total above; it is not in the list this number describes.
  el('tab-fleet').textContent = String(boardTasks().length);
  document.title = (open > 0 ? '(' + open + ') ' : '') + 'Starmap — BlueSpace';
}

let renderedView = null;
function render() {
  renderHeader();
  // A live pane repaints every few seconds. Without this the captain reading
  // line 400 of a diff is thrown back to the top by an event they did not cause.
  const sameView = renderedView === app.view;
  const pageY = window.scrollY;
  const paneNode = document.querySelector('.diff-pane');
  const paneY = paneNode ? paneNode.scrollTop : 0;
  const feedNode = document.querySelector('.detail-feed');
  const feedY = feedNode ? feedNode.scrollTop : 0;
  const feedBottom = feedNode ? feedNode.scrollHeight - feedNode.clientHeight - feedY < 40 : true;

  for (const v of ['inbox','fleet','diff','timeline','config']) {
    const node = el('view-' + v);
    const on = app.view === v;
    node.hidden = !on;
    if (!on) continue;
    if (v === 'inbox') node.innerHTML = renderInbox();
    else if (v === 'fleet') node.innerHTML = renderFleet();
    else if (v === 'diff') node.innerHTML = renderDiff();
    else if (v === 'timeline') node.innerHTML = renderTimeline();
    else node.innerHTML = renderConfig();
  }
  for (const t of document.querySelectorAll('.tab')) {
    t.setAttribute('aria-selected', String(t.dataset.view === app.view));
  }
  renderDetail();
  if (sameView) {
    window.scrollTo(0, pageY);
    const pane = document.querySelector('.diff-pane');
    if (pane && paneY) pane.scrollTop = paneY;
    const feed = document.querySelector('.detail-feed');
    // A feed the captain has left at the bottom follows the Crew; one they have
    // scrolled up in stays where they put it.
    if (feed) feed.scrollTop = feedBottom ? feed.scrollHeight : feedY;
  }
  renderedView = app.view;
  restoreDrafts();
}

function restoreDrafts() {
  for (const node of document.querySelectorAll('[data-draft]')) {
    const key = node.dataset.draft;
    if (app.drafts.has(key)) node.value = app.drafts.get(key);
  }
}

/* ---- Helm's own window ----------------------------------------------------
 * The map used to answer "what is running" with the fleet alone, and Helm is
 * not in the fleet — it runs in the captain's terminal, under no orchestrator,
 * and it can fan out. This block is that spend, and every word of it is hedged
 * on purpose: it is read from files, after the fact, by a server that is not
 * watching anything.
 */
function totalTokensOf(t) {
  const c = (t && t.totals) || {};
  return (c.input || 0) + (c.output || 0) + (c.cacheRead || 0) + (c.cacheCreation || 0);
}

function helmAgentRows(w) {
  return (w.subagents || []).map((a) => `
    <li class="helm-agent">
      <span class="helm-kind">${esc(a.agentType || 'sub-agent')}</span>
      <span class="helm-what">${esc(a.description || 'no description recorded')}</span>
      <span class="num">${esc(tokens(totalTokensOf(a.tokens)))}</span>
    </li>`).join('');
}

function renderHelm() {
  const ws = app.helm.windows || [];
  if (!ws.length) return '';
  const fanned = ws.reduce((n, w) => n + ((w.subagents || []).length), 0);
  const all = ws.reduce((n, w) => n + totalTokensOf(w.total), 0);
  const rows = ws.map((w) => `
    <div class="helm-win">
      <div class="helm-head">
        <span class="helm-cwd">${esc(w.cwd || '')}</span>
        <span class="num">${esc(tokens(totalTokensOf(w.total)))} ${esc(tr('tokens'))}</span>
      </div>
      ${((w.subagents || []).length) ? `<ul class="helm-agents">${helmAgentRows(w)}</ul>` : ''}
    </div>`).join('');
  return `<section class="helm">
    <h4>${esc(tr('Helm’s own window'))} <span class="hint">&middot; ${esc(tokens(all))} ${esc(tr('tokens'))}${fanned ? ' &middot; ' + esc(nOf(fanned, 'sub-agent', 'sub-agents', '个子 agent')) : ''}</span></h4>
    ${rows}
    <p class="hint">${esc(tr('Read from the transcript on disk, not watched live — work that started in the last few seconds may not be here yet. These are Helm’s own sub-agents, not the fleet’s: no worktree, no Sentinel, no ceiling, and nothing above.'))}</p>
  </section>`;
}

/* ---- 1. inbox ------------------------------------------------------------- */
function renderInbox() {
  const open = app.decisions.slice().sort((a, b) => (a.openedAt || 0) - (b.openedAt || 0));
  if (!app.loaded) return `<div class="skeleton">${esc(tr('Loading…'))}</div>`;
  if (open.length === 0) {
    const crew = activeCrewCount();
    const queued = app.tasks.filter((t) => t.state === 'queued').length;
    let line = tr('The fleet has nothing to ask you. A card lands here the moment a Crew needs a call.');
    if (crew === 0 && app.tasks.length === 0) line = tr('No tasks yet. Talk to Helm and the fleet will show up here.');
    else if (crew === 0 && queued === 0) line = tr('Everything is parked. Nothing is burning tokens right now.');
    // THE SCREEN THE CAPTAIN WAS LOOKING AT. "Nothing needs you · 0 crew
    // working" was true about the fleet and false about the machine: two of
    // Helm's sub-agents were running at the time. The fleet counts stay exactly
    // as they were — they are correct — and Helm's own spend is named
    // separately, because they are different things and conflating them is what
    // made the original screen a lie.
    return `<div class="empty">
      <div class="ring" aria-hidden="true"></div>
      <h3>${esc(tr('Nothing needs you'))}</h3>
      <p>${esc(line)}</p>
      <p class="hint num">${esc(tr('{0} crew working · {1} queued · {2} tokens', crew, queued, tokens(app.usage.total)))}</p>
    </div>` + renderHelm();
  }

  const map = taskById();
  const cards = open.map((d) => {
    const t = map.get(d.taskId);
    const waited = Math.max(0, app.now - (d.openedAt || app.now));
    const heat = waited > 30 * 60000 ? 'hot' : waited > 5 * 60000 ? 'warm' : '';
    const busy = app.busy.has(d.id);
    const opts = (d.options || []).map((o) => `
      <button class="opt" data-act="answer" data-id="${attr(d.id)}" data-answer="${attr(o.id)}" ${busy ? 'disabled' : ''}>
        <span class="label">${esc(o.label)}</span>
        ${o.detail ? `<span class="detail">${esc(o.detail)}</span>` : ''}
      </button>`).join('');
    const long = d.context && d.context.length > 420;
    const expanded = app.expandedContext.has(d.id);
    return `<article class="card decision">
      <div class="meta">
        ${t ? `<span class="chip" style="${sc(t.state)}" data-state><span class="dot"></span>${esc(stateLabel(t.state))}</span>` : ''}
        <span class="muted">${esc(t ? t.title : tr('task {0}', String(d.taskId).slice(0, 8)))}</span>
        <span class="dim">·</span>
        <span class="dim">${esc(t ? projectName(t.projectId) : '')}</span>
        <span class="wait ${heat}" style="margin-left:auto">${esc(tr('waiting {0}', dur(waited)))}</span>
      </div>
      <h3 class="q">${esc(d.question)}</h3>
      ${d.context ? `<div class="context ${long && !expanded ? 'clamped' : ''}">${esc(d.context)}</div>
        ${long ? `<button class="btn ghost sm" data-act="ctx" data-id="${attr(d.id)}" style="margin:-8px 0 12px">${esc(expanded ? tr('Show less') : tr('Show more'))}</button>` : ''}` : ''}
      ${opts ? `<div class="opts">${opts}</div>` : ''}
      ${busy ? `<div class="answered">${esc(tr('Sending…'))}</div>` : `
      <div class="freeform">
        <input class="field" type="text" data-draft="d:${attr(d.id)}" data-act-key="answer-free" data-id="${attr(d.id)}"
               placeholder="${attr(opts ? tr('Or answer in your own words…') : tr('Type your answer…'))}" aria-label="${attr(tr('Free-text answer'))}">
        <button class="btn primary" data-act="answer-free" data-id="${attr(d.id)}">${esc(tr('Send'))}</button>
      </div>`}
    </article>`;
  }).join('');

  return `<div class="section-head"><h2>${esc(tr('Decision inbox'))}</h2><span class="count">${esc(tr('{0} open · oldest first', open.length))}</span></div>
    <div class="inbox">${cards}</div>`;
}

/* ---- 2. fleet ------------------------------------------------------------- */
function renderFleet() {
  if (!app.loaded) return `<div class="skeleton">${esc(tr('Loading…'))}</div>`;
  const map = taskById();
  const activity = lastActivity();
  const dependents = new Map();
  for (const t of app.tasks) for (const d of (t.dependsOn || [])) {
    if (!dependents.has(d)) dependents.set(d, []);
    dependents.get(d).push(t);
  }

  const shown = boardTasks();
  // EVERY state, every time. An absent column reads as "this cannot happen
  // here"; a column showing 0 reads as "nothing is here right now", which is the
  // true statement and the one that makes the lifecycle legible — the captain
  // can see that `needs_rework` and `awaiting_decision` exist before the first
  // time one of them is holding up their work.
  const groups = STATES.map((state) => {
    const list = shown.filter((t) => t.state === state)
      .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    const cards = list.length
      ? list.map((t) => taskCard(t, map, dependents, activity)).join('')
      : `<div class="slot-empty">${esc(tr('none'))}</div>`;
    return `<section class="group${list.length ? '' : ' quiet'}">
      <div class="section-head" title="${attr(tr(STATE_HELP[state] || ''))}">
        <h2 style="${sc(state)};color:var(--sc)">${esc(stateLabel(state))}</h2>
        <span class="count">${list.length}</span>
      </div>
      <div class="grid">${cards}</div>
    </section>`;
  }).join('');

  const hidden = dismissedCount();
  // Never a bare count with no way back to what it counts: a task the captain
  // cleared is still a task that ran, still in `blue ps`, and still holding a
  // worktree. This line is the door back to it.
  const cleared = hidden > 0 || app.showDismissed
    ? `<div class="board-foot">
        <button class="btn ghost sm" data-act="show-dismissed">${esc(app.showDismissed
          ? tr('Hide cleared') : tr('{0} cleared — show', hidden))}</button>
        <span class="dim">${tr('Clearing a card hides it here. Nothing is deleted: the task, its worktree and its branch stay exactly where they are, and {0} still lists it.', '<span class="mono">blue ps</span>')}</span>
      </div>` : '';

  // Kept above the board rather than instead of it: a captain looking at their
  // first empty fleet should see both what will appear here and where.
  const nothing = app.tasks.length === 0
    ? `<div class="empty"><div class="ring" aria-hidden="true"></div><h3>${esc(tr('No tasks yet'))}</h3>
        <p>${esc(tr('Helm creates tasks; the orchestrator dispatches them. Everything the fleet does will appear here.'))}</p></div>`
    : '';
  return nothing + `<div class="board">${groups}${cleared}</div>` + (app.tasks.length === 0 ? renderHelm() : '');
}

function taskCard(t, map, dependents, activity) {
  const busy = app.busy.has(t.id);
  const live = ACTIVE.has(t.state);
  const act = activity.get(t.id);
  const deps = (t.dependsOn || []).map((id) => {
    const d = map.get(id);
    const met = d && d.state === 'landed';
    const cls = met ? 'met' : (d && TERMINAL.has(d.state) ? '' : 'blocked');
    return `<span class="dep ${cls}" title="${attr(d ? d.title : id)}">↑ ${esc(d ? truncate(d.title, 24) : String(id).slice(0, 8))}</span>`;
  }).join('');
  const blocks = dependents.get(t.id) || [];
  const elapsed = TERMINAL.has(t.state)
    ? tr('ran {0}', dur((t.updatedAt || t.createdAt) - t.createdAt))
    : dur(app.now - (t.createdAt || app.now));
  const rework = t.reworkCount > 0
    ? `<span title="${attr(tr('Sentinel sent this back {0}×', t.reworkCount))}">${esc(tr('rework'))} <b>${t.reworkCount}</b></span>` : '';

  // THE CHIP CARRIES THE ID, NOT THE STATE. The card is already sitting in a
  // column headed with its state, so the chip was saying it twice — while the
  // one identifier every `blue` command takes was nowhere on the card. The
  // colour and the pulsing dot still carry the state, which is what that chip
  // was actually being read for at a glance.
  return `<article class="card task" style="${sc(t.state)}">
    <div class="row">
      <button class="chip mono id ${live ? 'pulse' : ''}" style="${sc(t.state)}" data-state
        data-act="copy" data-copy="${attr(t.id)}"
        title="${attr(t.id + ' · ' + stateLabel(t.state) + ' — ' + tr('Click to copy'))}"
      ><span class="dot"></span>${esc(shortId(t.id))}</button>
      ${t.kind === 'recon' ? '<span class="chip">recon</span>' : ''}
      <span class="dim" style="margin-left:auto;font-size:11.5px">${esc(projectName(t.projectId))}</span>
    </div>
    <div class="title">${esc(t.title)}</div>
    <div class="facts">
      <span title="${attr(tr('Tokens this task consumed — what a Crew actually spends. Dollars only exist for a metered (API-key) run.'))}">${esc(tr('tokens'))} <b>${tokens(taskTokens(t.id))}</b></span>
      <span title="${attr(TERMINAL.has(t.state) ? tr('Total lifetime') : tr('Since created'))}">${esc(elapsed)}</span>
      ${rework}
    </div>
    ${deps || blocks.length ? `<div class="deps">
      ${deps}
      ${blocks.length ? `<span class="dep" title="${attr(blocks.map((b) => b.title).join(', '))}">↓ ${esc(tr('blocks {0}', blocks.length))}</span>` : ''}
    </div>` : ''}
    ${act ? `<div class="activity" title="${attr(act.line)}">${esc(truncate(act.line, 110))}</div>` : ''}
    <div class="controls">
      ${live ? `<button class="btn ghost sm" data-act="open-detail" data-id="${attr(t.id)}" title="${attr(tr('Watch this Crew work, without attaching to its tmux session'))}">${esc(tr('Live'))}</button>` : ''}
      <button class="btn ghost sm" data-act="open-diff" data-id="${attr(t.id)}">${esc(tr('Diff'))}</button>
      ${!TERMINAL.has(t.state) ? (app.held.has(t.id) ? `
        <button class="btn ghost sm" data-act="steer-toggle" data-id="${attr(t.id)}">${esc(app.steering.has(t.id) ? tr('Close') : tr('Steer'))}</button>
        <button class="btn ghost sm danger" data-act="cancel" data-id="${attr(t.id)}" ${busy ? 'disabled' : ''}>${busy ? '…' : esc(tr('Cancel'))}</button>`
        // A live session is a handle in the memory of the process that spawned
        // it. This map did not, so the buttons would fail on click — and a
        // disabled button that says why beats a message typed into a box that
        // was never going to deliver it.
        : `<span class="dim held-note" title="${attr(tr('A live Crew belongs to the process that spawned it. This Starmap is view-only — run it with --orchestrate, or steer from the Helm window.'))}">${esc(tr('another process holds this Crew'))}</span>`) : ''}
      ${TERMINAL.has(t.state) ? (t.dismissedAt
        ? `<button class="btn ghost sm" data-act="restore" data-id="${attr(t.id)}" style="margin-left:auto">${esc(tr('Restore'))}</button>`
        : `<button class="btn ghost sm" data-act="dismiss" data-id="${attr(t.id)}" style="margin-left:auto" title="${attr(tr('Take it off the board. Nothing is deleted.'))}">${esc(tr('Clear'))}</button>`) : ''}
    </div>
    ${app.steering.has(t.id) ? `<div class="steer">
      <textarea class="field" rows="2" data-draft="s:${attr(t.id)}" placeholder="${attr(tr('Message to the Crew — course correction, extra context, a constraint…'))}"></textarea>
      <div><button class="btn primary sm" data-act="steer-send" data-id="${attr(t.id)}">${esc(tr('Send to Crew'))}</button></div>
    </div>` : ''}
  </article>`;
}

/* ---- 3. diff -------------------------------------------------------------- */
function renderDiff() {
  if (!app.loaded) return `<div class="skeleton">${esc(tr('Loading…'))}</div>`;
  if (app.tasks.length === 0) {
    return `<div class="empty"><div class="ring" aria-hidden="true"></div><h3>${esc(tr('Nothing to review'))}</h3>
      <p>${esc(tr('When a Crew changes code, its diff shows up here — no click-through to anywhere else.'))}</p></div>`;
  }
  const order = boardTasks().slice().sort((a, b) => {
    const rank = (t) => (t.worktree ? 0 : 1);
    return rank(a) - rank(b) || (b.updatedAt || 0) - (a.updatedAt || 0);
  });
  if (!app.selected || !order.some((t) => t.id === app.selected)) {
    const first = order[0];
    app.selected = first ? first.id : null;
  }
  const rail = order.map((t) => `
    <button class="rail-item" data-act="select-task" data-id="${attr(t.id)}" style="${sc(t.state)}" aria-current="${t.id === app.selected}">
      <span class="t">${esc(truncate(t.title, 60))}</span>
      <span class="s"><span class="dot"></span>${esc(stateLabel(t.state))} · ${esc(projectName(t.projectId))}</span>
    </button>`).join('');

  const task = app.tasks.find((t) => t.id === app.selected);
  let pane;
  if (!task) pane = `<div class="skeleton">${esc(tr('Select a task.'))}</div>`;
  else if (app.diff.id !== task.id || app.diff.loading) {
    pane = `<div class="skeleton">${esc(tr('Reading the worktree…'))}</div>`;
    if (app.diff.id !== task.id) loadDiff(task.id);
  } else if (app.diff.error) {
    pane = `<div class="empty"><h3>${esc(tr('Could not read the diff'))}</h3><p>${esc(app.diff.error)}</p></div>`;
  } else if (!app.diff.data || !app.diff.data.diff) {
    const reason = (app.diff.data && app.diff.data.reason) || tr('nothing to show yet');
    pane = `<div class="empty"><div class="ring" aria-hidden="true"></div><h3>${esc(tr('No diff'))}</h3><p>${esc(reason)}.</p>
      ${app.diff.data && app.diff.data.path ? `<p class="hint mono">${esc(app.diff.data.path)}</p>` : ''}</div>`;
  } else {
    pane = renderDiffBody(task, app.diff.data);
  }

  return `<div class="diff-wrap">
    <aside class="card rail" aria-label="${attr(tr('Tasks'))}">${rail}</aside>
    <div class="card diff-pane">${pane}</div>
  </div>`;
}

function renderDiffBody(task, data) {
  const files = parseDiff(data.diff);
  const adds = files.reduce((n, f) => n + f.adds, 0);
  const dels = files.reduce((n, f) => n + f.dels, 0);
  const keys = files.map((f) => task.id + '::' + f.path);
  const openCount = keys.filter((k) => app.expanded.has(k)).length;
  const allOpen = keys.length > 0 && openCount === keys.length;
  const live = ACTIVE.has(task.state);
  const head = `<div class="diff-head">
    <strong>${esc(task.title)}</strong>
    <span class="chip ${live ? 'pulse' : ''}" style="${sc(task.state)}" data-state><span class="dot"></span>${esc(STATE_LABEL[task.state] || task.state)}</span>
    <span class="dim num">${esc(nOf(files.length, 'file', 'files', '个文件'))}</span>
    <span class="stat-add num">+${adds}</span><span class="stat-del num">−${dels}</span>
    ${data.base ? `<span class="path">${esc(tr('vs {0}', data.base))}</span>` : ''}
    ${live ? `<span class="dim" title="${attr(tr('A working Crew rewrites its worktree constantly; this pane re-reads it on the same tick the board uses.'))}">${esc(tr('auto'))}</span>` : ''}
    <button class="btn ghost sm" data-act="toggle-all" style="margin-left:auto">${esc(allOpen ? tr('Collapse all') : tr('Expand all'))}</button>
    <button class="btn ghost sm" data-act="reload-diff">${esc(tr('Reload'))}</button>
  </div>`;

  const body = files.map((f, i) => {
    const key = keys[i];
    const open = app.expanded.has(key);
    const bar = `<div class="file-bar" data-act="toggle-file" data-key="${attr(key)}">
      <span class="fp">${esc(f.path)}</span>
      ${f.tag ? `<span class="tag">${esc(f.tag)}</span>` : ''}
      <span class="stat-add num">+${f.adds}</span><span class="stat-del num">−${f.dels}</span>
      <span class="caret">${open ? '▾ hide' : '▸ show'}</span>
    </div>`;
    const lines = open
      ? `<div class="lines">${f.hunks.map(hunkHtml).join('')}</div>`
      : `<div class="collapsed-note">${esc(tr('{0} lines — click to expand.', f.lines))}</div>`;
    return `<section class="file" data-i="${i}">${bar}${lines}</section>`;
  }).join('');

  return head + (files.length ? body : `<div class="collapsed-note">${esc(tr('Diff produced no file sections.'))}</div>`)
    + (data.truncated ? `<div class="collapsed-note">${esc(tr('Diff was truncated by the server — open the worktree for the rest.'))}</div>` : '');
}

function hunkHtml(h) {
  const rows = [`<div class="ln hunk"><span class="g"></span><span class="g"></span><span class="c">${esc(h.head)}</span></div>`];
  for (const l of h.lines) {
    const mark = l.t === 'add' ? '+' : l.t === 'del' ? '−' : ' ';
    rows.push(`<div class="ln ${l.t}"><span class="g">${l.o == null ? '' : l.o}</span><span class="g">${l.n == null ? '' : l.n}</span><span class="c">${esc(mark + l.s)}</span></div>`);
  }
  return rows.join('');
}

/** Unified-diff parser. Deliberately syntax-neutral: structure, not highlighting. */
function parseDiff(text) {
  const files = [];
  let cur = null, oldNo = 0, newNo = 0;
  for (const line of String(text).split('\n')) {
    // A real unified-diff line always carries a marker (' ', '+', '-', '\'), so
    // a bare empty string is only ever the artefact of the trailing newline.
    if (line === '') continue;
    if (line.startsWith('diff --git ')) {
      cur = { path: gitPath(line), hunks: [], adds: 0, dels: 0, lines: 0, tag: '' };
      files.push(cur);
      continue;
    }
    if (!cur) {
      cur = { path: '(diff)', hunks: [], adds: 0, dels: 0, lines: 0, tag: '' };
      files.push(cur);
    }
    if (line.startsWith('@@')) {
      const m = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
      oldNo = m ? +m[1] : 0;
      newNo = m ? +m[2] : 0;
      cur.hunks.push({ head: line, lines: [] });
      continue;
    }
    const h = cur.hunks[cur.hunks.length - 1];
    if (!h) {
      if (line.startsWith('new file')) cur.tag = 'new';
      else if (line.startsWith('deleted file')) cur.tag = 'deleted';
      else if (line.startsWith('rename ')) cur.tag = 'renamed';
      else if (line.startsWith('Binary files')) { cur.tag = 'binary'; cur.hunks.push({ head: line, lines: [] }); }
      continue;
    }
    cur.lines++;
    if (line.startsWith('+')) { h.lines.push({ t: 'add', o: null, n: newNo++, s: line.slice(1) }); cur.adds++; }
    else if (line.startsWith('-')) { h.lines.push({ t: 'del', o: oldNo++, n: null, s: line.slice(1) }); cur.dels++; }
    else if (line.startsWith('\\')) { h.lines.push({ t: 'note', o: null, n: null, s: line }); }
    else { h.lines.push({ t: 'ctx', o: oldNo++, n: newNo++, s: line.slice(1) }); }
  }
  return files;
}
function gitPath(header) {
  const m = / b\/(.+)$/.exec(header);
  let p = m ? m[1] : header.replace('diff --git ', '');
  if (p.startsWith('"') && p.endsWith('"')) p = p.slice(1, -1);
  return p;
}

/**
 * Read a task's worktree.
 *
 * `quiet` is what makes the auto-refresh bearable: it leaves the current diff on
 * screen while the next one is fetched, so a working Crew's pane updates in
 * place instead of blinking through "Reading the worktree…" every few seconds.
 * A failure in quiet mode is swallowed for the same reason — the diff on screen
 * is a second old, and replacing it with an error because one poll lost a race
 * is worse than showing it.
 */
async function loadDiff(id, quiet) {
  if (!quiet) { app.diff = { id, loading: true, data: null, error: null }; paint(); }
  try {
    const data = await api('/api/diff/' + encodeURIComponent(id));
    if (app.diff.id !== id && !quiet) return;
    if (quiet && app.selected !== id) return;
    // Same rule as the feed: a poll that returns what is already on screen is
    // not a reason to rebuild the pane the captain is reading.
    const unchanged = quiet && app.diff.data && app.diff.data.diff === data.diff;
    app.diff = { id, loading: false, data, error: null };
    if (unchanged) return;
  } catch (err) {
    if (quiet) return;
    if (app.diff.id !== id) return;
    app.diff = { id, loading: false, data: null, error: err.message };
  }
  paint();
}

/**
 * The diff of a LIVE task is a moving target, so it moves.
 *
 * Only for a task that is actually running: a landed or failed worktree does not
 * change, and re-reading it on a timer would be a git process every few seconds
 * for an answer that cannot have changed.
 */
setInterval(() => {
  if (document.hidden || app.view !== 'diff' || !app.selected) return;
  const task = app.tasks.find((t) => t.id === app.selected);
  if (!task || !ACTIVE.has(task.state)) return;
  if (app.diff.id !== task.id || app.diff.loading) return;
  loadDiff(task.id, true);
}, 4000);

/** Take a finished task off the board, or put it back. */
async function dismiss(id, off) {
  try {
    await api('/api/task/' + encodeURIComponent(id) + '/dismiss', {
      method: 'POST', body: JSON.stringify({ dismissed: off }),
    });
    await loadState();
    paint();
  } catch (err) {
    toast(err.message, 'err');
  }
}

/* ---- 5. settings ----------------------------------------------------------
 *
 * The four settings a captain changes BECAUSE OF SOMETHING THEY JUST WATCHED
 * HAPPEN, put on the surface where they watched it happen. Permission posture,
 * the model and the launcher's own flags are not here: those are decided once,
 * from the terminal, and a dashboard offering them would be inviting a change
 * nobody had a reason to make.
 *
 * Everything written here lands in the same `config.json` `blue config set`
 * writes, and the orchestrator re-reads that file — so a ceiling raised here
 * applies to the next check, not to the next process. That is the whole reason
 * this panel is worth having.
 */
async function loadConfigPanel() {
  app.cfg = { ...app.cfg, loading: true, error: null };
  try {
    app.cfg = { ...app.cfg, data: await api('/api/config'), loading: false };
  } catch (err) {
    app.cfg = { ...app.cfg, loading: false, error: err.message };
  }
  paint();
}

async function saveConfigPanel(patch) {
  app.cfg = { ...app.cfg, saving: true, error: null };
  paint();
  try {
    const out = await api('/api/config', { method: 'POST', body: JSON.stringify(patch) });
    app.cfg = { ...app.cfg, data: { ...app.cfg.data, ...out }, saving: false, saved: Date.now() };
    toast(tr('Saved'));
  } catch (err) {
    app.cfg = { ...app.cfg, saving: false, error: err.message };
    toast(err.message, 'err');
  }
  paint();
}

/** Read one field out of the form and send only what the captain changed. */
function submitConfig() {
  const val = (id) => { const n = el(id); return n ? n.value.trim() : ''; };
  const num = (raw) => (raw === '' ? 0 : Number(raw));
  const patch = {
    language: val('cfg-language') || null,
    address: val('cfg-address') || null,
    maxTokensPerTask: num(val('cfg-tokens')),
    maxConcurrentCrew: Number(val('cfg-crew') || 1),
    notify: val('cfg-notify') !== 'off',
  };
  if (!Number.isFinite(patch.maxTokensPerTask) || patch.maxTokensPerTask < 0) {
    toast(tr('The token ceiling must be a whole number, or empty for none.'), 'err');
    return;
  }
  if (!Number.isInteger(patch.maxConcurrentCrew) || patch.maxConcurrentCrew < 1) {
    toast(tr('At least one Crew has to be allowed to run.'), 'err');
    return;
  }
  saveConfigPanel(patch);
}

function renderConfig() {
  if (app.cfg.data === null) {
    if (!app.cfg.loading && !app.cfg.error) loadConfigPanel();
    if (app.cfg.error) {
      return `<div class="empty"><h3>${esc(tr('Could not read the settings'))}</h3><p>${esc(app.cfg.error)}</p></div>`;
    }
    return `<div class="skeleton">${esc(tr('Loading…'))}</div>`;
  }
  const c = app.cfg.data.config || {};
  const r = app.cfg.data.resolved || {};
  const d = app.cfg.data.defaults || {};
  const busy = app.cfg.saving ? 'disabled' : '';

  const field = (label, help, control) => `<div class="cfg-row">
    <div class="cfg-label"><strong>${esc(label)}</strong><span class="dim">${help}</span></div>
    <div class="cfg-control">${control}</div>
  </div>`;

  return `<div class="section-head"><h2>${esc(tr('Settings'))}</h2>
      <span class="count">${esc(tr('written to {0}', app.cfg.data.configPath || 'config.json'))}</span></div>
    <div class="card cfg">
      ${field(tr('Language'),
        tr('The language Helm writes to you in. Empty means it follows whatever you write.'),
        `<input class="field" id="cfg-language" value="${attr(c.language || '')}" placeholder="${attr(r.language || tr('follow what I write'))}" ${busy}>`)}
      ${field(tr('What Helm calls you'),
        tr('Empty derives it from the language — {0} here.', esc(r.address || 'Captain')),
        `<input class="field" id="cfg-address" value="${attr(c.address || '')}" placeholder="${attr(r.address || 'Captain')}" ${busy}>`)}
      ${field(tr('Token ceiling per task'),
        tr('0 or empty means NO ceiling. On a Claude subscription this is the only thing that stops a runaway task — and it counts cache reads, which are most of any long task.'),
        `<input class="field" id="cfg-tokens" type="number" min="0" step="100000" value="${attr(c.maxTokensPerTask || '')}" placeholder="${attr(tr('no ceiling'))}" ${busy}>`)}
      ${field(tr('Tell me when a task settles'),
        tr('A desktop notification when a task lands, fails, or stops on a question. Helm cannot do this itself — a Claude Code session only speaks when you speak to it, so this comes from the orchestrator.'),
        `<select class="field" id="cfg-notify" ${busy}>
          <option value="on"${c.notify === false ? '' : ' selected'}>${esc(tr('On'))}</option>
          <option value="off"${c.notify === false ? ' selected' : ''}>${esc(tr('Off'))}</option>
        </select>`)}
      ${field(tr('Crews at once'),
        tr('How many tasks may run in parallel. Default {0}. Each one is a real Claude Code session on your login — see docs/compliance.md before raising it far.', d.maxConcurrentCrew ?? 10),
        `<input class="field" id="cfg-crew" type="number" min="1" step="1" value="${attr(String(c.maxConcurrentCrew ?? ''))}" ${busy}>`)}
      <div class="cfg-foot">
        <button class="btn primary" data-act="cfg-save" ${busy}>${esc(app.cfg.saving ? tr('Saving…') : tr('Save'))}</button>
        <span class="dim">${esc(tr('Applies to the next check the orchestrator makes — no restart. A task already past a ceiling is already gone.'))}</span>
      </div>
      ${app.cfg.error ? `<div class="cfg-err">${esc(app.cfg.error)}</div>` : ''}
    </div>`;
}

/* ---- 4. timeline ---------------------------------------------------------- */
function buildTimeline() {
  const rec = new Map();
  for (const t of app.tasks) rec.set(t.id, { task: t, created: t.createdAt, points: [] });
  for (const e of app.events) {
    const r = e.taskId ? rec.get(e.taskId) : null;
    if (!r) continue;
    if (e.type === 'task.created') r.created = Math.min(r.created || e.at, e.at);
    else if (e.type === 'task.state_changed') r.points.push({ at: e.at, to: e.to });
  }
  const now = Date.now();
  const rows = [];
  for (const r of rec.values()) {
    const start = r.created || (r.points.length ? r.points[0].at : now);
    const points = r.points.slice().sort((a, b) => a.at - b.at);
    const segs = [];
    let cursor = start, state = 'queued';
    for (const p of points) {
      if (p.at > cursor) segs.push({ state, from: cursor, to: p.at });
      cursor = Math.max(cursor, p.at);
      state = p.to;
    }
    const terminal = TERMINAL.has(state);
    const end = terminal ? Math.max(cursor, start + 1) : now;
    if (!terminal || segs.length === 0) segs.push({ state, from: cursor, to: end });
    rows.push({ task: r.task, start, end, segs, state });
  }
  rows.sort((a, b) => a.start - b.start);
  return { rows, now };
}

function renderTimeline() {
  if (!app.loaded) return `<div class="skeleton">${esc(tr('Loading…'))}</div>`;
  const { rows, now } = buildTimeline();
  if (!rows.length) {
    return `<div class="empty"><div class="ring" aria-hidden="true"></div><h3>${esc(tr('No history yet'))}</h3>
      <p>${esc(tr('Once tasks run, this shows where the fleet ran in parallel, where it serialized, and where it waited on you.'))}</p></div>`;
  }
  const t0 = rows.reduce((m, r) => Math.min(m, r.start), Infinity);
  const t1 = Math.max(rows.reduce((m, r) => Math.max(m, r.end), -Infinity), now);
  const span = Math.max(1, t1 - t0);
  const pad = span * 0.02;
  const lo = t0 - pad, hi = t1 + pad, width = hi - lo;
  const pct = (t) => ((t - lo) / width) * 100;

  // Insight line: the three things the captain actually wants from a timeline.
  let waited = 0, peak = 0;
  const edges = [];
  for (const r of rows) for (const s of r.segs) {
    if (s.state === 'awaiting_decision') waited += s.to - s.from;
    if (ACTIVE.has(s.state)) { edges.push([s.from, 1], [s.to, -1]); }
  }
  edges.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  let cur = 0;
  for (const [, d] of edges) { cur += d; if (cur > peak) peak = cur; }

  const step = niceStep(width);
  const tickAt = [];
  for (let t = Math.ceil(lo / step) * step; t < hi; t += step) {
    // Drop ticks hugging the right edge — their label would clip.
    if (pct(t) < 95) tickAt.push(t);
  }
  const ticks = tickAt.map((t) => `<div class="tl-tick" style="left:${pct(t).toFixed(3)}%"><span>${esc(clock(t))}</span></div>`);
  const grid = tickAt.map((t) => `<div class="tl-tick" style="left:${pct(t).toFixed(3)}%"></div>`).join('');

  const body = rows.map((r) => {
    const segs = r.segs.map((s) => {
      const left = pct(s.from), right = pct(s.to);
      const w = Math.max(0.25, right - left);
      return `<div class="tl-seg" style="${sc(s.state)};left:${left.toFixed(3)}%;width:${w.toFixed(3)}%"
        title="${attr((stateLabel(s.state)) + ' · ' + dur(s.to - s.from) + ' · ' + clock(s.from))}"></div>`;
    }).join('');
    return `<div class="tl-row">
      <div class="tl-label" style="${sc(r.state)}">
        <span class="end" title="${attr(stateLabel(r.state))}"></span>
        <button data-act="open-diff" data-id="${attr(r.task.id)}" title="${attr(r.task.title + ' — ' + (stateLabel(r.state)))}">${esc(truncate(r.task.title, 40))}</button>
      </div>
      <div class="tl-track"><div class="tl-grid">${grid}</div>${segs}
        <div class="tl-now" style="left:${pct(now).toFixed(3)}%"></div></div>
    </div>`;
  }).join('');

  const legend = STATES.filter((s) => rows.some((r) => r.segs.some((g) => g.state === s)))
    .map((s) => `<span><i style="${sc(s)};background:var(--sc)"></i>${esc(stateLabel(s))}</span>`).join('');

  return `<div class="section-head"><h2>${esc(tr('Timeline'))}</h2><span class="count">${esc(tr('{0} tasks · {1} span', rows.length, dur(t1 - t0)))}</span></div>
    <div class="tl-insight">
      <span>${esc(tr('peak parallel crew'))} <b>${peak}</b></span>
      <span>${esc(tr('waited on you'))} <b>${dur(waited)}</b></span>
      <span>${esc(tr('first dispatch'))} <b>${esc(clock(t0))}</b></span>
    </div>
    <div class="tl-legend">${legend}</div>
    <div class="card tl-scroll" style="padding:12px 14px">
      <div class="tl" style="--label-w:190px">
        <div class="tl-axis">${ticks.join('')}</div>
        ${body}
      </div>
    </div>`;
}

function niceStep(span) {
  const targets = [1e3, 5e3, 15e3, 30e3, 60e3, 3e5, 6e5, 9e5, 18e5, 36e5, 108e5, 216e5, 432e5, 864e5];
  for (const t of targets) if (span / t <= 12) return t;
  return 864e5;
}

/* ---- actions -------------------------------------------------------------- */
function toast(msg, kind) {
  const node = document.createElement('div');
  node.className = 'toast ' + (kind || '');
  node.textContent = msg;
  el('toasts').appendChild(node);
  setTimeout(() => node.remove(), kind === 'err' ? 7000 : 3500);
}

async function answer(decisionId, text) {
  if (!text || app.busy.has(decisionId)) return;
  app.busy.add(decisionId);
  paint();
  try {
    await api('/api/decision/' + encodeURIComponent(decisionId), { method: 'POST', body: JSON.stringify({ answer: text }) });
    app.drafts.delete('d:' + decisionId);
    toast('Answered.', 'ok');
    await loadState();
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    app.busy.delete(decisionId);
    paint();
  }
}

async function cancelTask(id) {
  const t = app.tasks.find((x) => x.id === id);
  if (!confirm('Cancel "' + (t ? t.title : id) + '"? The Crew stops and the worktree is torn down.')) return;
  app.busy.add(id);
  paint();
  try {
    await api('/api/task/' + encodeURIComponent(id) + '/cancel', { method: 'POST' });
    toast('Cancelled.', 'ok');
    await loadState();
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    app.busy.delete(id);
    paint();
  }
}

async function steer(id) {
  const msg = (app.drafts.get('s:' + id) || '').trim();
  if (!msg) { toast('Write a message first.', 'err'); return; }
  try {
    await api('/api/task/' + encodeURIComponent(id) + '/steer', { method: 'POST', body: JSON.stringify({ message: msg }) });
    app.drafts.delete('s:' + id);
    app.steering.delete(id);
    toast('Sent to the Crew.', 'ok');
    paint();
  } catch (err) {
    toast(err.message, 'err');
  }
}

function setView(v) {
  if (!['inbox','fleet','diff','timeline','config'].includes(v)) v = 'inbox';
  app.view = v;
  const hash = v === 'diff' && app.selected ? '#diff/' + app.selected : '#' + v;
  if (location.hash !== hash) history.replaceState(null, '', hash);
  paint();
  window.scrollTo({ top: 0 });
}

document.addEventListener('click', (ev) => {
  const node = ev.target.closest('[data-act]');
  if (!node) return;
  const { act, id, view, key, answer: ans } = node.dataset;
  if (act === 'tab') { setView(view); return; }
  if (act === 'lang') { setLang(app.lang === 'zh' ? 'en' : 'zh'); return; }
  if (act === 'cfg-save') { submitConfig(); return; }
  if (act === 'answer') { answer(id, ans); return; }
  if (act === 'answer-free') { answer(id, (app.drafts.get('d:' + id) || '').trim()); return; }
  if (act === 'ctx') { app.expandedContext.has(id) ? app.expandedContext.delete(id) : app.expandedContext.add(id); paint(); return; }
  if (act === 'cancel') { cancelTask(id); return; }
  if (act === 'steer-toggle') { app.steering.has(id) ? app.steering.delete(id) : app.steering.add(id); paint(); return; }
  if (act === 'steer-send') { steer(id); return; }
  if (act === 'open-diff') { app.detail.id = null; app.selected = id; setView('diff'); return; }
  if (act === 'select-task') { app.selected = id; history.replaceState(null, '', '#diff/' + id); paint(); return; }
  if (act === 'reload-diff') { if (app.selected) loadDiff(app.selected); return; }
  if (act === 'toggle-all') { toggleAllFiles(); return; }
  if (act === 'copy') { copyText(node.dataset.copy); return; }
  if (act === 'dismiss') { dismiss(id, true); return; }
  if (act === 'restore') { dismiss(id, false); return; }
  if (act === 'show-dismissed') { app.showDismissed = !app.showDismissed; paint(); return; }
  if (act === 'open-detail') { openDetail(id); return; }
  if (act === 'close-detail') {
    // The backdrop carries the action, and the window sits inside it — so a
    // click on the window itself must not read as a click on the backdrop.
    if (node.classList.contains('modal-back') && ev.target !== node) return;
    closeDetail();
    return;
  }
  if (act === 'toggle-file') {
    app.expanded.has(key) ? app.expanded.delete(key) : app.expanded.add(key);
    paint();
  }
});

/* ---- the live detail window ----------------------------------------------
 *
 * "What is this Crew actually doing?" used to be answerable in two ways, both
 * bad: read one truncated line on a card, or attach to the Crew's tmux session
 * and risk typing into a live worker's composer. This is the third — the same
 * event stream the board folds, for one task, read-only, updating on its own
 * timer while it is open and costing nothing when it is closed.
 */
function openDetail(id) {
  app.detail = { id, data: null, loading: true, error: null };
  paint();
  refreshDetail();
}

function closeDetail() {
  app.detail = { id: null, data: null, loading: false, error: null };
  paint();
}

async function refreshDetail() {
  const id = app.detail.id;
  if (!id) return;
  try {
    const data = await api('/api/task/' + encodeURIComponent(id));
    if (app.detail.id !== id) return;
    app.detail = { id, data, loading: false, error: null };
  } catch (err) {
    if (app.detail.id !== id) return;
    // Keep whatever is on screen; a lost poll is not a reason to blank the
    // window a captain is reading.
    app.detail = { id, data: app.detail.data, loading: false, error: err.message };
  }
  // NOT `paint()`. A full repaint every two seconds rebuilt the view behind the
  // window and re-ran the overlay's entry animation with it, so the captain saw
  // the whole page flash on a timer. The window updates itself; nothing else
  // has moved.
  renderDetail();
}

/* Faster than the board, because this is the pane you open BECAUSE you want to
   watch. Stops dead when nothing is open — the guard is the first line. */
setInterval(() => { if (app.detail.id && !document.hidden) refreshDetail(); }, 2000);

/** One line per crew signal, oldest first — the same events the cards sample. */
function detailFeed(events) {
  const rows = [];
  for (const e of events) {
    let cls = 'ev', line = null;
    if (e.type === 'crew.tool_use') { cls = 'ev tool'; line = e.name + (e.inputPreview ? ' · ' + e.inputPreview : ''); }
    else if (e.type === 'crew.tool_result') { cls = 'ev res'; line = truncate(e.resultPreview || tr('(no output)'), 400); }
    else if (e.type === 'crew.text') { cls = 'ev say'; line = e.text; }
    else if (e.type === 'crew.thinking') { cls = 'ev dimline'; line = tr('thinking…'); }
    else if (e.type === 'crew.usage') { cls = 'ev dimline'; line = tokens(usageOf(e)) + ' ' + tr('tokens') + ' · ' + (e.model || ''); }
    else if (e.type === 'crew.spawned') { cls = 'ev mark'; line = tr('crew spawned'); }
    else if (e.type === 'crew.exited') { cls = 'ev mark'; line = tr('crew exited') + (e.reason ? ' · ' + e.reason : ''); }
    else if (e.type === 'sentinel.started') { cls = 'ev mark'; line = tr('sentinel reviewing the diff'); }
    else if (e.type === 'sentinel.verdict') { cls = 'ev mark'; line = (e.pass ? tr('verdict: pass — ') : tr('verdict: fail — ')) + e.reasoning; }
    else if (e.type === 'task.state_changed') { cls = 'ev mark'; line = (stateLabel(e.from)) + ' → ' + (stateLabel(e.to)) + (e.reason ? ' · ' + e.reason : ''); }
    else if (e.type === 'task.failed') { cls = 'ev fail'; line = e.reason || 'failed'; }
    if (!line) continue;
    rows.push(`<div class="${cls}"><span class="at">${esc(clock(e.at))}</span><span class="tx">${esc(line)}</span></div>`);
  }
  return rows;
}

function usageOf(e) {
  return (e.inputTokens || 0) + (e.outputTokens || 0) + (e.cacheReadTokens || 0) + (e.cacheCreationTokens || 0);
}

/**
 * Draw the window, and then STOP DRAWING IT.
 *
 * The first version rebuilt `innerHTML` on every call. Three things made that
 * visible rather than merely wasteful: `.modal-back` carries an entry animation,
 * so every rebuild re-ran the fade; the feed lost its scroll position; and the
 * elapsed time ticks every second, so no cheap "did anything change" test could
 * ever answer no. The shell is now built once per open, and only the two things
 * that actually move are written again.
 */
function renderDetail() {
  const host = el('detail');
  if (!host) return;
  if (!app.detail.id) {
    if (host.innerHTML) { host.innerHTML = ''; host.dataset.taskId = ''; host.dataset.feed = ''; }
    return;
  }

  const d = app.detail.data;
  const t = (d && d.task) || app.tasks.find((x) => x.id === app.detail.id);
  if (!t) {
    host.innerHTML = `<div class="modal-back" data-act="close-detail"><div class="modal card">
      <div class="modal-head"><strong>${esc(tr('Loading…'))}</strong>
      <button class="btn ghost sm" data-act="close-detail" style="margin-left:auto">${esc(tr('Close'))}</button></div></div></div>`;
    host.dataset.taskId = '';
    return;
  }

  const live = ACTIVE.has(t.state);
  const feed = d ? detailFeed(d.events || []) : [];
  const elapsed = TERMINAL.has(t.state)
    ? tr('ran {0}', dur((t.updatedAt || t.createdAt) - t.createdAt))
    : dur(app.now - (t.createdAt || app.now));
  // The command is offered, never run for them: attaching puts a keyboard on a
  // live Crew's composer, and that is the captain's decision to make.
  const attach = t.crewId ? 'tmux -L bluespace attach -t blue:=blue-' + String(t.crewId).slice(0, 8) : null;

  const shell = `<div class="modal-back" data-act="close-detail">
    <div class="modal card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span class="chip ${live ? 'pulse' : ''}" style="${sc(t.state)}"><span class="dot"></span>${esc(stateLabel(t.state))}</span>
        <button class="chip mono id" data-act="copy" data-copy="${attr(t.id)}"
          title="${attr(t.id + ' — ' + tr('Click to copy'))}">${esc(shortId(t.id))}</button>
        <strong>${esc(t.title)}</strong>
        <span class="dim">${esc(projectName(t.projectId))}</span>
        <button class="btn ghost sm" data-act="close-detail" style="margin-left:auto">${esc(tr('Close'))}</button>
      </div>
      <div class="modal-facts"></div>
      ${t.worktree ? `<div class="modal-path mono" data-act="copy" data-copy="${attr(t.worktree)}" title="${attr(tr('Click to copy'))}">${esc(t.worktree)}</div>` : ''}
      ${attach ? `<div class="modal-path mono" data-act="copy" data-copy="${attr(attach)}" title="${attr(tr('Click to copy — attaching gives you a keyboard on a live Crew'))}">${esc(attach)}</div>` : ''}
      <div class="detail-feed"></div>
      <div class="modal-foot">
        <button class="btn ghost sm" data-act="open-diff" data-id="${attr(t.id)}">${esc(tr('Diff'))}</button>
        ${!TERMINAL.has(t.state) ? `<button class="btn ghost sm danger" data-act="cancel" data-id="${attr(t.id)}">${esc(tr('Cancel'))}</button>` : ''}
        <span class="dim" style="margin-left:auto">${esc(tr('Read-only. Esc closes.'))}</span>
      </div>
    </div>
  </div>`;

  // Rebuilt only when the window opens, or opens on a different task.
  if (host.dataset.taskId !== t.id) {
    host.innerHTML = shell;
    host.dataset.taskId = t.id;
    host.dataset.feed = '';
  }

  // Small, no animation, and genuinely different every second.
  const facts = host.querySelector('.modal-facts');
  if (facts) {
    facts.innerHTML = `<span>${esc(tr('tokens'))} <b>${tokens(taskTokens(t.id))}</b></span>
      <span>${esc(elapsed)}</span>
      ${t.reworkCount > 0 ? `<span>${esc(tr('rework'))} <b>${t.reworkCount}</b></span>` : ''}
      <span>${esc(nOf(feed.length, 'event', 'events', '条事件'))}</span>
      ${app.detail.error ? `<span class="warn" title="${attr(app.detail.error)}">${esc(tr('poll failed — showing the last good read'))}</span>` : ''}`;
  }

  // The feed is rewritten only when it has actually grown — otherwise a captain
  // reading row 3 of 200 is thrown to the bottom by a poll that returned the
  // same 200 rows. The language is in the signature because switching it
  // rewrites every line.
  const node = host.querySelector('.detail-feed');
  const sig = app.lang + ':' + feed.length;
  if (node && host.dataset.feed !== sig) {
    const atBottom = !node.childElementCount || node.scrollHeight - node.clientHeight - node.scrollTop < 40;
    node.innerHTML = feed.length ? feed.join('') : `<div class="collapsed-note">${esc(tr('No crew signals yet.'))}</div>`;
    if (atBottom) node.scrollTop = node.scrollHeight;
    host.dataset.feed = sig;
  }
}

/**
 * Copy, with a fallback rather than a button that silently does nothing.
 *
 * `navigator.clipboard` needs a secure context. `127.0.0.1` is one, so the fast
 * path is the normal path — but a captain who reached the map over a LAN address
 * would otherwise click an id and get no clipboard and no explanation.
 */
function copyText(text) {
  if (!text) return;
  const done = () => toast(tr('Copied'));
  const fallback = () => {
    const node = document.createElement('textarea');
    node.value = text;
    node.setAttribute('readonly', '');
    node.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(node);
    node.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    node.remove();
    ok ? done() : toast(tr('Could not copy'), 'err');
  };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

/** Every file of the selected diff, open or closed together. */
function toggleAllFiles() {
  const task = app.tasks.find((t) => t.id === app.selected);
  if (!task || !app.diff.data || !app.diff.data.diff) return;
  const keys = parseDiff(app.diff.data.diff).map((f) => task.id + '::' + f.path);
  const allOpen = keys.length > 0 && keys.every((k) => app.expanded.has(k));
  for (const k of keys) allOpen ? app.expanded.delete(k) : app.expanded.add(k);
  paint();
}

document.addEventListener('input', (ev) => {
  const node = ev.target.closest('[data-draft]');
  if (node) app.drafts.set(node.dataset.draft, node.value);
});

document.addEventListener('keydown', (ev) => {
  if (typing()) {
    if (ev.key === 'Enter' && ev.target.dataset.actKey === 'answer-free') {
      ev.preventDefault();
      answer(ev.target.dataset.id, (app.drafts.get('d:' + ev.target.dataset.id) || '').trim());
    }
    if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && ev.target.dataset.draft && ev.target.dataset.draft.startsWith('s:')) {
      ev.preventDefault();
      steer(ev.target.dataset.draft.slice(2));
    }
    return;
  }
  if (ev.key === 'Escape' && app.detail.id) { closeDetail(); return; }
  const map = { '1': 'inbox', '2': 'fleet', '3': 'diff', '4': 'timeline', '5': 'config' };
  if (map[ev.key]) setView(map[ev.key]);
});

window.addEventListener('hashchange', applyHash);
function applyHash() {
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('diff/')) { app.selected = decodeURIComponent(h.slice(5)); app.view = 'diff'; }
  else if (['inbox','fleet','diff','timeline','config'].includes(h)) app.view = h;
  paint();
}

/* ---- keep --chrome-h honest so sticky content clears the header ----------- */
function measureChrome() {
  const node = el('chrome');
  const h = node && node.offsetHeight ? node.offsetHeight : 100;
  document.documentElement.style.setProperty('--chrome-h', h + 'px');
}
if (window.ResizeObserver) {
  try { new ResizeObserver(measureChrome).observe(el('chrome')); } catch { /* older engine */ }
}
window.addEventListener('resize', measureChrome);
measureChrome();

/* ---- clock: elapsed times stay honest without a full re-render ------------- */
setInterval(() => {
  app.now = Date.now();
  if (app.view === 'timeline' || app.view === 'inbox') { if (!typing()) paint(); }
}, 1000);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { loadState().catch(() => {}); loadHelm(); }
});

/* Helm's window is read from disk, so it is refreshed on its own slow timer —
   fast enough that a captain watching a fan-out sees it appear, slow enough
   that the server is not searching the transcript tree on every fleet poll. */
setInterval(() => { if (!document.hidden) loadHelm(); }, 15000);

/* ---- boot ----------------------------------------------------------------- */
app.lang = detectLang();
document.documentElement.lang = app.lang === 'zh' ? 'zh-CN' : 'en';
applyHash();
loadState()
  .then(loadEvents)
  .then(() => { connect(); paint(); loadHelm(); })
  .catch((err) => {
    setConn('down');
    el('view-inbox').innerHTML = `<div class="empty"><h3>${esc(tr('Cannot reach the Starmap server'))}</h3>
      <p>${esc(err.message)}</p><p class="hint">${esc(tr('Retrying every 3 seconds.'))}</p></div>`;
    startPolling();
  });
</script>
</body>
</html>
